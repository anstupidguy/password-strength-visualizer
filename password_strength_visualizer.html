  <div id="root"></div>

  <script type="text/babel">
    const Eye = ({ className = "w-5 h-5" }) => (

        <path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      </svg>
    );

    const EyeOff = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.03 10.03 0 014.122-.963c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-4.275-4.275a3 3 0 00-4.243-4.243M3 3l18 18" />
      </svg>

    const ShieldCheck = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>

      </svg>

    const ShieldAlert = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    );

    const Zap = ({ className = "w-5 h-5" }) => (

      </svg>
    );

    const Clock = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const Hash = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14" />

    const Info = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const RefreshCw = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    const Copy = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
    );

    const Check = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    );

    const COMMON_WORDS = [
      "password", "123456", "123456789", "12345678", "12345", "qwerty", "password1",
      "admin", "welcome", "iloveyou", "sunshine", "princess", "monkey", "dragon",
      "master", "football", "baseball", "shadow", "superman", "trustno1", "letmein",
      "pussycat", "login", "system", "charlie", "donald", "batman", "freedom", "matrix",
      "security", "starwars", "pokemon", "computer", "internet", "hello", "secret"
    ];

    const KEYBOARD_ROWS = [
      "qwertyuiop",
      "asdfghjkl",
      "zxcvbnm",
      "1234567890"
    ];

    function analyzePassword(pwd) {
      if (!pwd) return null;

      const len = pwd.length;
      let hasLower = false;
      let hasUpper = false;
      let hasDigit = false;
      let hasSymbol = false;

      for (let c of pwd) {
        if (/[a-z]/.test(c)) hasLower = true;
        else if (/[A-Z]/.test(c)) hasUpper = true;
        else if (/[0-9]/.test(c)) hasDigit = true;
        else hasSymbol = true;
      }

      // Calculate Character Pool (R)
      let poolSize = 0;
      if (hasLower) poolSize += 26;
      if (hasUpper) poolSize += 26;
      if (hasDigit) poolSize += 10;
      if (hasSymbol) poolSize += 33;
      if (poolSize === 0) poolSize = 1;

      // Theoretical Max Entropy (bits) = L * log2(Pool)
      const rawEntropy = len * Math.log2(poolSize);

      // Character mapping & pattern detection
      const charTokens = new Array(len).fill(null);
      const pwdLower = pwd.toLowerCase();

      // 1. Check for Dictionary Words
      COMMON_WORDS.forEach(word => {
        let idx = pwdLower.indexOf(word);
        while (idx !== -1) {
          for (let i = idx; i < idx + word.length; i++) {
            charTokens[i] = {
              char: pwd[i],
              pattern: "dictionary",
              label: "Dictionary Word",
              token: word
            };
          }
          idx = pwdLower.indexOf(word, idx + 1);
        }
      });

      // 2. Check for Keyboard Sequences (e.g., qwerty, asdf)
      KEYBOARD_ROWS.forEach(row => {
        for (let i = 0; i < row.length - 2; i++) {
          const seq = row.slice(i, i + 3);
          const revSeq = seq.split("").reverse().join("");
          
          [seq, revSeq].forEach(s => {
            let idx = pwdLower.indexOf(s);
            while (idx !== -1) {
              for (let k = idx; k < idx + s.length; k++) {
                if (!charTokens[k] || charTokens[k].pattern !== "dictionary") {
                  charTokens[k] = {
                    char: pwd[k],
                    pattern: "spatial",
                    label: "Keyboard Sequence",
                    token: s
                  };
                }
              }
              idx = pwdLower.indexOf(s, idx + 1);
            }
          });
        }
      });

      // 3. Check for Character Sequences (e.g. abc, 123, 789)
      for (let i = 0; i < len - 2; i++) {
        const c1 = pwd.charCodeAt(i);
        const c2 = pwd.charCodeAt(i + 1);
        const c3 = pwd.charCodeAt(i + 2);

        if ((c2 === c1 + 1 && c3 === c2 + 1) || (c2 === c1 - 1 && c3 === c2 - 1)) {
          for (let k = i; k < i + 3; k++) {
            if (!charTokens[k]) {
              charTokens[k] = {
                char: pwd[k],
                pattern: "sequence",
                label: "Sequential Run",
                token: pwd.slice(i, i + 3)
              };
            }
          }
        }
      }

      // 4. Check for Repeated Characters
      const charCounts = {};
      for (let c of pwd) charCounts[c] = (charCounts[c] || 0) + 1;

      for (let i = 0; i < len; i++) {
        if (charCounts[pwd[i]] > 2 && !charTokens[i]) {
          charTokens[i] = {
            char: pwd[i],
            pattern: "repeat",
            label: "Repeated Char",
            token: `${pwd[i]} (x${charCounts[pwd[i]]})`
          };
        }
      }

      // 5. Default remaining characters as Random/Strong
      for (let i = 0; i < len; i++) {
        if (!charTokens[i]) {
          charTokens[i] = {
            char: pwd[i],
            pattern: "bruteforce",
            label: "Random Character",
            token: pwd[i]
          };
        }
      }

      // Calculate Entropy Deductions
      let patternDeductions = 0;
      let dictCount = 0;
      let seqCount = 0;
      let repeatCount = 0;

      charTokens.forEach(t => {
        if (t.pattern === "dictionary") dictCount++;
        if (t.pattern === "spatial" || t.pattern === "sequence") seqCount++;
        if (t.pattern === "repeat") repeatCount++;
      });

      patternDeductions += dictCount * 2.5;
      patternDeductions += seqCount * 1.8;
      patternDeductions += repeatCount * 1.2;

      // Effective Entropy
      const effectiveEntropy = Math.max(1, rawEntropy - patternDeductions);

      // Guesses estimation: 2^Effective Entropy
      const totalGuesses = Math.pow(2, effectiveEntropy);

      // Score determination (0 - 6)
      let score = 0;
      if (effectiveEntropy < 28) score = 0;
      else if (effectiveEntropy < 40) score = 1;
      else if (effectiveEntropy < 60) score = 2;
      else if (effectiveEntropy < 80) score = 3;
      else if (effectiveEntropy < 120) score = 4;
      else if (effectiveEntropy < 160) score = 5;
      else score = 6;

      // Feedback generation
      const suggestions = [];
      let warning = "";

      if (dictCount > 0) {
        warning = "Contains common dictionary words or popular passwords.";
        suggestions.push("Avoid common words and names; replace them with random phrases.");
      } else if (seqCount > 0) {
        warning = "Contains sequential characters or keyboard patterns.";
        suggestions.push("Avoid straight sequences like '123' or 'qwerty'.");
      } else if (len < 10) {
        warning = "Password is too short.";
      }

      if (len < 12) suggestions.push("Increase length to at least 12–16 characters for exponentially higher entropy.");
      if (!hasUpper) suggestions.push("Add uppercase letters.");
      if (!hasSymbol) suggestions.push("Add special symbols (!@#$%).");
      if (!hasDigit) suggestions.push("Include numeric digits.");

      return {
        length: len,
        poolSize,
        rawEntropy: Math.round(rawEntropy * 10) / 10,
        effectiveEntropy: Math.round(effectiveEntropy * 10) / 10,
        totalGuesses,
        score,
        charTokens,
        charPools: { hasLower, hasUpper, hasDigit, hasSymbol },
        feedback: { warning, suggestions }
      };
    }

    function formatCrackTime(seconds) {
      if (seconds < 0.001) return "Instantaneous";
      if (seconds < 1) return `${Math.round(seconds * 1000)} milliseconds`;
      if (seconds < 60) return `${Math.round(seconds)} seconds`;
      if (seconds < 3600) return `${Math.round(seconds / 60)} minutes`;
      if (seconds < 86400) return `${Math.round(seconds / 3600)} hours`;
      if (seconds < 2592000) return `${Math.round(seconds / 86400)} days`;
      if (seconds < 31536000) return `${Math.round(seconds / 2592000)} months`;
      
      const years = seconds / 31536000;
      if (years < 100) return `${Math.round(years)} years`;
      if (years < 10000) return `${Math.round(years / 100)} centuries`;
      if (years < 1e9) return `${(years / 1e6).toFixed(1)} million years`;
      if (years < 1e12) return `${(years / 1e9).toFixed(1)} billion years`;
      return "Lifetime of the Universe+";
    }

    function getScoreDetails(score) {
      switch (score) {
        case 0: return { label: "Very Weak", color: "bg-red-500", text: "text-red-500", ring: "ring-red-500/30" };
        case 1: return { label: "Weak", color: "bg-orange-500", text: "text-orange-500", ring: "ring-orange-500/30" };
        case 2: return { label: "Fair", color: "bg-amber-400", text: "text-amber-400", ring: "ring-amber-400/30" };
        case 3: return { label: "Strong", color: "bg-emerald-400", text: "text-emerald-400", ring: "ring-emerald-400/30" };
        case 4: return { label: "Very Strong", color: "bg-cyan-400", text: "text-cyan-400", ring: "ring-cyan-400/30" };
        case 5: return { label: "Insanely Strong", color: "bg-purple-500", text: "text-purple-400", ring: "ring-purple-500/30" };
        case 6: return { label: "BEAST", color: "bg-fuchsia-500", text: "text-fuchsia-400", ring: "ring-fuchsia-500/30" };
        default: return { label: "No Input", color: "bg-slate-700", text: "text-slate-500", ring: "ring-transparent" };
      }
    }

    function getPatternStyle(pattern) {
      switch (pattern) {
        case "dictionary":
          return { bg: "bg-red-500/20", border: "border-red-500/50", text: "text-red-300", name: "Dictionary Match" };
        case "spatial":
          return { bg: "bg-purple-500/20", border: "border-purple-500/50", text: "text-purple-300", name: "Keyboard Pattern" };
        case "sequence":
          return { bg: "bg-amber-500/20", border: "border-amber-500/50", text: "text-amber-300", name: "Sequential Run" };
        case "repeat":
          return { bg: "bg-orange-500/20", border: "border-orange-500/50", text: "text-orange-300", name: "Repeated Char" };
        case "bruteforce":
        default:
          return { bg: "bg-emerald-500/20", border: "border-emerald-500/50", text: "text-emerald-300", name: "High-Entropy Token" };
      }
    }

    function generateStrongPassword(length = 16) {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{}|;:,.<>?";
      let result = "";
      const array = new Uint32Array(length);
      window.crypto.getRandomValues(array);
      for (let i = 0; i < length; i++) {
        result += chars[array[i] % chars.length];
      }
      return result;
    }

    function App() {
      const [password, setPassword] = React.useState("");
      const [showPassword, setShowPassword] = React.useState(true);
      const [copied, setCopied] = React.useState(false);

      const analysis = React.useMemo(() => analyzePassword(password), [password]);
      const scoreDetails = analysis ? getScoreDetails(analysis.score) : getScoreDetails(-1);

      const handleCopy = async () => {
        if (!password) return;
        let success = false;

        // Method 1: Modern Clipboard API
        if (navigator?.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(password);
            success = true;
          } catch (err) {
            // Permission fallback
          }
        }

        // Method 2: Textarea fallback for local files or sandboxed environments
        if (!success) {
          try {
            const textarea = document.createElement("textarea");
            textarea.value = password;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            textarea.style.left = "-9999px";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            success = document.execCommand("copy");
            document.body.removeChild(textarea);
          } catch (err) {
            console.error("Copy failed:", err);
          }
        }

        if (success) {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      const handleGenerate = (length = 16) => {
        const newPwd = generateStrongPassword(length);
        setPassword(newPwd);
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans p-4 sm:p-6 md:p-10 flex justify-center items-start selection:bg-cyan-500/30 selection:text-cyan-200">
          <div className="w-full max-w-5xl space-y-8">
            
            {/* Header */}
            <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800/80 pb-6">
              <div>
                <div className="flex items-center gap-3">
                  <div className="p-2.5 bg-cyan-500/10 border border-cyan-500/20 rounded-xl text-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.15)]">
                    <Zap className="w-7 h-7" />
                  </div>
                  <div>
                    <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
                      Entropy Guard
                    </h1>
                    <p className="text-slate-400 text-xs sm:text-sm mt-0.5">
                      Real-time Password Entropy, Pattern Topography & Crackability Visualizer
                    </p>
                  </div>
                </div>
              </div>

              <div className="inline-flex items-center gap-2 bg-emerald-500/10 text-emerald-400 px-3.5 py-2 rounded-full text-xs font-semibold border border-emerald-500/20 shadow-[0_0_12px_rgba(16,185,129,0.1)] self-start md:self-auto">
                <ShieldCheck className="w-4 h-4" />
                100% Zero-Server / Client-Side Processing
              </div>
            </header>

            {/* Input Card */}
            <main className="grid grid-cols-1 gap-8">
              
              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl backdrop-blur-sm space-y-8">
                
                <div className="space-y-3">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                      Target Password String
                    </label>
                    <div className="flex items-center gap-1.5 flex-wrap">
                      <button
                        onClick={() => handleGenerate(16)}
                        className="inline-flex items-center gap-1 text-xs font-medium text-cyan-400 hover:text-cyan-300 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/20 px-2.5 py-1.5 rounded-lg transition-all"
                      >
                        <RefreshCw className="w-3.5 h-3.5" />
                        Strong
                      </button>
                      <button
                        onClick={() => handleGenerate(24)}
                        className="inline-flex items-center gap-1 text-xs font-medium text-purple-400 hover:text-purple-300 bg-purple-500/10 hover:bg-purple-500/20 border border-purple-500/20 px-2.5 py-1.5 rounded-lg transition-all"
                      >
                        <Zap className="w-3.5 h-3.5" />
                        Insanely Strong
                      </button>
                      <button
                        onClick={() => handleGenerate(48)}
                        className="inline-flex items-center gap-1 text-xs font-medium text-fuchsia-400 hover:text-fuchsia-300 bg-fuchsia-500/10 hover:bg-fuchsia-500/20 border border-fuchsia-500/20 px-2.5 py-1.5 rounded-lg transition-all shadow-[0_0_12px_rgba(217,70,239,0.2)]"
                      >
                        <ShieldCheck className="w-3.5 h-3.5 text-fuchsia-400" />
                        BEAST
                      </button>
                      {password && (
                        <button
                          onClick={handleCopy}
                          className="inline-flex items-center gap-1.5 text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg transition-all"
                        >
                          {copied ? <Check className="w-3.5 h-3.5 text-emerald-400" /> : <Copy className="w-3.5 h-3.5" />}
                          {copied ? "Copied" : "Copy"}
                        </button>
                      )}
                    </div>
                  </div>

                  <div className="relative group">
                    <input
                      type={showPassword ? "text" : "password"}
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="Type or paste a password to inspect..."
                      className="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500/80 text-white text-lg sm:text-2xl px-5 py-4 rounded-xl focus:outline-none focus:ring-4 focus:ring-cyan-500/10 transition-all font-mono pr-14 tracking-wide shadow-inner"
                      autoFocus
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-cyan-400 transition-colors p-2 rounded-lg hover:bg-slate-800/50"
                      title={showPassword ? "Mask password" : "Reveal password"}
                    >
                      {showPassword ? <EyeOff className="w-5 h-5" /> : <Eye className="w-5 h-5" />}
                    </button>
                  </div>
                </div>

                {/* Analysis Dashboard */}
                {password && analysis ? (
                  <div className="space-y-8">
                    
                    {}
                    <div className="space-y-3 bg-slate-950/60 border border-slate-800/80 p-5 rounded-xl">
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold uppercase tracking-wider text-slate-400">
                          Overall Security Index
                        </span>
                        <span className={`text-sm sm:text-base font-extrabold uppercase tracking-wide ${scoreDetails.text}`}>
                          {scoreDetails.label}
                        </span>
                      </div>

                      <div className="grid grid-cols-7 gap-1.5 sm:gap-2 h-3.5 w-full bg-slate-950 rounded-full p-0.5 border border-slate-800">
                        {[0, 1, 2, 3, 4, 5, 6].map((level) => (
                          <div
                            key={level}
                            className={`h-full rounded-full transition-all duration-500 ${
                              analysis.score >= level ? scoreDetails.color : "bg-slate-800/40"
                            }`}
                          />
                        ))}
                      </div>

                      <div className="flex justify-between text-[10px] sm:text-[11px] text-slate-500 font-mono pt-1">
                        <span>0 bits</span>
                        <span>28 bits</span>
                        <span>40 bits</span>
                        <span>60 bits</span>
                        <span>80 bits</span>
                        <span>120 bits</span>
                        <span>160+ bits</span>
                      </div>
                    </div>

                    {}
                    <div className="space-y-4 bg-slate-950/80 p-5 sm:p-6 rounded-xl border border-slate-800 relative overflow-hidden">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800/80 pb-3">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                          Pattern Topography Breakdown
                        </h3>
                        <span className="text-xs text-slate-500 font-mono">
                          {analysis.length} {analysis.length === 1 ? "character" : "characters"}
                        </span>
                      </div>

                      <div className="flex flex-wrap gap-2 pt-2 font-mono">
                        {analysis.charTokens.map((item, idx) => {
                          const style = getPatternStyle(item.pattern);
                          return (
                            <div
                              key={idx}
                              className={`group relative flex flex-col items-center justify-center w-10 h-12 rounded-lg border ${style.bg} ${style.border} transition-all hover:scale-105 cursor-pointer shadow-sm`}
                            >
                              <span className={`text-base font-bold ${style.text}`}>
                                {showPassword ? item.char : "•"}
                              </span>
                              <span className="text-[9px] text-slate-500 font-mono leading-none mt-0.5">
                                #{idx + 1}
                              </span>

                              {/* Hover Tooltip */}
                              <div className="absolute bottom-full mb-2 hidden group-hover:flex flex-col items-start bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 shadow-xl z-20 whitespace-nowrap pointer-events-none">
                                <span className="font-bold text-white font-sans">{item.label}</span>
                                <span className="text-[11px] text-slate-400 font-mono mt-0.5">
                                  Matched Token: <span className="text-cyan-300">"{item.token}"</span>
                                </span>
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      {/* Pattern Legend */}
                      <div className="flex flex-wrap gap-4 pt-4 border-t border-slate-800/60 text-xs">
                        {[
                          { id: "dictionary", label: "Dictionary Word" },
                          { id: "spatial", label: "Keyboard Pattern" },
                          { id: "sequence", label: "Sequential Run" },
                          { id: "repeat", label: "Repeated Char" },
                          { id: "bruteforce", label: "High Entropy Token" }
                        ].map((leg) => {
                          const style = getPatternStyle(leg.id);
                          return (
                            <div key={leg.id} className="flex items-center gap-2 text-slate-400">
                              <span className={`w-3 h-3 rounded-sm border ${style.bg} ${style.border}`} />
                              <span>{leg.label}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {}
                    <div className="space-y-4">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                        Estimated Time to Crack Across Attack Vectors
                      </h3>

                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        
                        {/* Throttled Online */}
                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800/90 flex flex-col justify-between space-y-3">
                          <div className="flex items-center gap-2 text-slate-400">
                            <Clock className="w-4 h-4 text-emerald-400" />
                            <span className="text-xs font-semibold">Online (Throttled)</span>
                          </div>
                          <div>
                            <div className="text-lg font-bold font-mono text-white">
                              {formatCrackTime(analysis.totalGuesses / (100 / 3600))}
                            </div>
                            <div className="text-[11px] text-slate-500 mt-1">100 attempts / hour</div>
                          </div>
                        </div>

                        {/* Unthrottled Online */}
                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800/90 flex flex-col justify-between space-y-3">
                          <div className="flex items-center gap-2 text-slate-400">
                            <Clock className="w-4 h-4 text-amber-400" />
                            <span className="text-xs font-semibold">Online (Unthrottled)</span>
                          </div>
                          <div>
                            <div className="text-lg font-bold font-mono text-white">
                              {formatCrackTime(analysis.totalGuesses / 1000)}
                            </div>
                            <div className="text-[11px] text-slate-500 mt-1">1,000 attempts / sec</div>
                          </div>
                        </div>

                        {/* Offline Fast Hash */}
                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800/90 flex flex-col justify-between space-y-3">
                          <div className="flex items-center gap-2 text-slate-400">
                            <Clock className="w-4 h-4 text-red-400" />
                            <span className="text-xs font-semibold">Offline Fast Hash</span>
                          </div>
                          <div>
                            <div className="text-lg font-bold font-mono text-white">
                              {formatCrackTime(analysis.totalGuesses / 100000000000)}
                            </div>
                            <div className="text-[11px] text-slate-500 mt-1">100 Billion / sec (GPU cluster)</div>
                          </div>
                        </div>

                        {/* Offline Slow Hash */}
                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800/90 flex flex-col justify-between space-y-3">
                          <div className="flex items-center gap-2 text-slate-400">
                            <Clock className="w-4 h-4 text-cyan-400" />
                            <span className="text-xs font-semibold">Offline Slow Hash</span>
                          </div>
                          <div>
                            <div className="text-lg font-bold font-mono text-white">
                              {formatCrackTime(analysis.totalGuesses / 10000)}
                            </div>
                            <div className="text-[11px] text-slate-500 mt-1">10,000 / sec (bcrypt/Argon2)</div>
                          </div>
                        </div>

                      </div>
                    </div>

                    {}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      
                      {/* Entropy Metrics */}
                      <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 space-y-4">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                          <Hash className="w-4 h-4 text-cyan-400" />
                          Mathematical Entropy Matrix
                        </h3>
                        
                        <div className="space-y-3 text-sm">
                          <div className="flex justify-between items-center py-1.5 border-b border-slate-800/60">
                            <span className="text-slate-400">Character Set Pool Size (R)</span>
                            <span className="font-mono text-cyan-300 font-bold">{analysis.poolSize} chars</span>
                          </div>
                          <div className="flex justify-between items-center py-1.5 border-b border-slate-800/60">
                            <span className="text-slate-400">Raw Information Entropy</span>
                            <span className="font-mono text-white font-bold">{analysis.rawEntropy} bits</span>
                          </div>
                          <div className="flex justify-between items-center py-1.5 border-b border-slate-800/60">
                            <span className="text-slate-400">Effective Entropy (Adjusted)</span>
                            <span className="font-mono text-emerald-400 font-bold">{analysis.effectiveEntropy} bits</span>
                          </div>
                          <div className="flex justify-between items-center py-1.5">
                            <span className="text-slate-400">Estimated Unique Guesses</span>
                            <span className="font-mono text-cyan-400 font-bold">
                              {analysis.totalGuesses > 1e12 
                                ? analysis.totalGuesses.toExponential(2) 
                                : Math.round(analysis.totalGuesses).toLocaleString()}
                            </span>
                          </div>
                        </div>
                      </div>

                      {/* Character Sets Used */}
                      <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 space-y-4">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                          Character Diversity
                        </h3>

                        <div className="grid grid-cols-2 gap-3">
                          <div className={`p-3 rounded-lg border text-xs flex items-center justify-between ${analysis.charPools.hasLower ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                            <span>Lowercase (a-z)</span>
                            <span className="font-mono font-bold">{analysis.charPools.hasLower ? "✓" : "✗"}</span>
                          </div>

                          <div className={`p-3 rounded-lg border text-xs flex items-center justify-between ${analysis.charPools.hasUpper ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                            <span>Uppercase (A-Z)</span>
                            <span className="font-mono font-bold">{analysis.charPools.hasUpper ? "✓" : "✗"}</span>
                          </div>

                          <div className={`p-3 rounded-lg border text-xs flex items-center justify-between ${analysis.charPools.hasDigit ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                            <span>Numbers (0-9)</span>
                            <span className="font-mono font-bold">{analysis.charPools.hasDigit ? "✓" : "✗"}</span>
                          </div>

                          <div className={`p-3 rounded-lg border text-xs flex items-center justify-between ${analysis.charPools.hasSymbol ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                            <span>Symbols (!@#$)</span>
                            <span className="font-mono font-bold">{analysis.charPools.hasSymbol ? "✓" : "✗"}</span>
                          </div>
                        </div>
                      </div>

                    </div>

                    {}
                    {(analysis.feedback.warning || analysis.feedback.suggestions.length > 0) && (
                      <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 border-l-4 border-l-amber-500 space-y-3">
                        {analysis.feedback.warning && (
                          <div className="flex items-start gap-2.5 text-amber-400 font-medium text-sm">
                            <ShieldAlert className="w-5 h-5 shrink-0 mt-0.5" />
                            <p>{analysis.feedback.warning}</p>
                          </div>
                        )}

                        {analysis.feedback.suggestions.length > 0 && (
                          <div className="flex items-start gap-2.5 text-slate-300 text-sm">
                            <Info className="w-5 h-5 shrink-0 text-slate-500 mt-0.5" />
                            <ul className="list-disc list-inside space-y-1 text-slate-400">
                              {analysis.feedback.suggestions.map((sug, i) => (
                                <li key={i}>{sug}</li>
                              ))}
                            </ul>
                          </div>
                        )}
                      </div>
                    )}

                  </div>
                ) : (
                  <div className="py-16 text-center border-2 border-dashed border-slate-800/80 rounded-xl flex flex-col items-center justify-center gap-3">
                    <div className="p-4 bg-slate-900 rounded-full text-slate-600">
                      <ShieldCheck className="w-10 h-10" />
                    </div>
                    <p className="text-slate-400 text-sm">Type a password above to begin real-time security inspection.</p>
                    <div className="flex flex-wrap justify-center gap-2 mt-2">
                      <button
                        onClick={() => handleGenerate(16)}
                        className="text-xs font-semibold text-cyan-400 hover:text-cyan-300 bg-cyan-500/10 hover:bg-cyan-500/20 px-3.5 py-2 rounded-lg border border-cyan-500/20 transition-all"
                      >
                        Generate Strong (16)
                      </button>
                      <button
                        onClick={() => handleGenerate(24)}
                        className="text-xs font-semibold text-purple-400 hover:text-purple-300 bg-purple-500/10 hover:bg-purple-500/20 px-3.5 py-2 rounded-lg border border-purple-500/20 transition-all"
                      >
                        Generate Insanely Strong (24)
                      </button>
                      <button
                        onClick={() => handleGenerate(48)}
                        className="text-xs font-semibold text-fuchsia-400 hover:text-fuchsia-300 bg-fuchsia-500/10 hover:bg-fuchsia-500/20 px-3.5 py-2 rounded-lg border border-fuchsia-500/20 transition-all shadow-[0_0_12px_rgba(217,70,239,0.2)]"
                      >
                        Generate BEAST (48)
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </main>
          </div>
        </div>
      );
    }

    // Mount application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
